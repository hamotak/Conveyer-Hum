name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    name: lint-test-build (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run command
        env:
          CI: true
        run: |
          set -o pipefail
          mkdir -p artifacts/${{ github.run_id }}/pipeline
          npm run ${{ matrix.command }} 2>&1 | tee artifacts/${{ github.run_id }}/pipeline/${{ matrix.command }}.log

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ matrix.command }}-${{ github.run_id }}
          path: artifacts/${{ github.run_id }}/pipeline/${{ matrix.command }}.log

  ui-audit:
    name: ui-audit
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: always()
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start app
        run: |
          mkdir -p artifacts/${{ github.run_id }}/ui-audit
          npm run dev -- --hostname 0.0.0.0 --port 3001 > artifacts/${{ github.run_id }}/ui-audit/dev.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "Started server PID: $SERVER_PID"
          NODE_ENV=development POLISH_VIEWPORTS=desktop CLICK_TIMEOUT_MS=3000 node scripts/polish-ui-audit.mjs "${{ github.run_id }}-audit" 
          AUDIT_STATUS=$?
          kill $SERVER_PID >/dev/null 2>&1 || true
          exit $AUDIT_STATUS
        env:
          BASE_URL: http://127.0.0.1:3001
      - name: Upload ui-audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.run_id }}
          path: artifacts/${{ github.run_id }}/ui-audit
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-dev-log-${{ github.run_id }}
          path: artifacts/${{ github.run_id }}/ui-audit/dev.log
